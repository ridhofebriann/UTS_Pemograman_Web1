<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemesanan - BookHaven</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body id="page-checkout">
    <header class="main-header">
      <div class="container">
        <div class="logo">BookHaven</div>
        <nav class="main-nav">
          <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="stok.html">Katalog Buku</a></li>
            <li><a href="checkout.html" class="active">Pemesanan</a></li>
            <li><a href="tracking.html">Tracking</a></li>
            <li><a href="history.html">History</a></li>
          </ul>
        </nav>

        <div class="header-right">
          <div class="user-profile" id="user-profile-name">User</div>
          <button id="theme-toggle" class="theme-toggle-btn">
            <i class="fas fa-moon"></i>
          </button>
          <button id="btn-logout" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <h2>
        <i class="fas fa-file-invoice-dollar"></i> Formulir Pemesanan &
        Pembayaran
      </h2>

      <section class="card">
        <form id="checkout-form">
          <h3>Informasi Pemesan</h3>
          <div class="form-grid">
            <div class="form-group form-grid-span">
              <label for="nama-pemesan">Nama Lengkap</label>
              <input type="text" id="nama-pemesan" required />
            </div>
            <div class="form-group form-grid-span">
              <label for="alamat-pemesan">Alamat Lengkap</label>
              <textarea id="alamat-pemesan" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label for="telepon-pemesan">No. Telepon</label>
              <input type="tel" id="telepon-pemesan" required />
            </div>
            <div class="form-group">
              <label for="email-pemesan">Email</label>
              <input type="email" id="email-pemesan" required />
            </div>
          </div>

          <h3>Informasi Pembayaran</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="metode-bayar">Metode Pembayaran</label>
              <select id="metode-bayar">
                <option value="va-bca">Virtual Account BCA</option>
                <option value="va-mandiri">Virtual Account Mandiri</option>
                <option value="gopay">GoPay</option>
                <option value="cod">Cash on Delivery (COD)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="kode-promo">Kode Promo (Opsional)</label>
              <input type="text" id="kode-promo" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <i class="fas fa-credit-card"></i> Bayar Sekarang
          </button>
        </form>
      </section>
    </main>

    <footer class="main-footer">
      <p>&copy; 2025 BookHaven. Dibuat untuk UTS Pemrograman Web 1.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

    <div id="toast-notification" class="toast">
      <span id="toast-message">Ini adalah pesan</span>
    </div>
  </body>
</html>
