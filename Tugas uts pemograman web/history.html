<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Transaksi - BookHaven</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body id="page-history">
    <header class="main-header">
      <div class="container">
        <div class="logo">BookHaven</div>
        <nav class="main-nav">
          <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="stok.html">Katalog Buku</a></li>
            <li><a href="checkout.html">Pemesanan</a></li>
            <li><a href="tracking.html">Tracking</a></li>
            <li><a href="history.html" class="active">History</a></li>
          </ul>
        </nav>
        <div class="header-right">
          <div class="user-profile" id="user-profile-name">User</div>
          <button id="theme-toggle" class="theme-toggle-btn">
            <i class="fas fa-moon"></i>
          </button>
          <button id="btn-logout" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2><i class="fas fa-history"></i> History Transaksi Anda</h2>
        <p>Berikut adalah riwayat semua transaksi Anda.</p>

        <div class="table-container">
          <table class="stock-table">
            <thead>
              <tr>
                <th>ID Transaksi</th>
                <th>Tanggal</th>
                <th>Nama Barang</th>
                <th>Nomor DO</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="main-footer">
      <p>&copy; 2025 BookHaven. Dibuat untuk UTS Pemrograman Web 1.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

    <div id="toast-notification" class="toast">
      <span id="toast-message">Ini adalah pesan</span>
    </div>
  </body>
</html>
