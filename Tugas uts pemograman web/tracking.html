<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Pengiriman - BookHaven</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body id="page-tracking">
    <header class="main-header">
      <div class="container">
        <div class="logo">BookHaven</div>
        <nav class="main-nav">
          <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="stok.html">Katalog Buku</a></li>
            <li><a href="checkout.html">Pemesanan</a></li>
            <li><a href="tracking.html" class="active">Tracking</a></li>
            <li><a href="history.html">History</a></li>
          </ul>
        </nav>

        <div class="header-right">
          <div class="user-profile" id="user-profile-name">User</div>
          <button id="theme-toggle" class="theme-toggle-btn">
            <i class="fas fa-moon"></i>
          </button>
          <button id="btn-logout" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <h2><i class="fas fa-truck-loading"></i> Lacak Pengiriman</h2>
      <section class="card">
        <form id="tracking-form">
          <div class="form-group">
            <label for="do-input">Masukkan Nomor Delivery Order (DO)</label>
            <input
              type="text"
              id="do-input"
              placeholder="Contoh: 20230012"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-search"></i> Cari
          </button>
        </form>
      </section>

      <section id="tracking-result" class="card hidden"></section>
    </main>

    <footer class="main-footer">
      <p>&copy; 2025 BookHaven. Dibuat untuk UTS Pemrograman Web 1.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

    <div id="toast-notification" class="toast">
      <span id="toast-message">Ini adalah pesan</span>
    </div>
  </body>
</html>
